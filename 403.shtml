<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Motorfix Injection Services</title>
    <link rel="icon" href="../media/slogo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #28a745;
            --dark-green: #0A4A2A;
            --dark: #212529;
            --grey: #6c757d;
            --light-grey: #f8f9fa;
            --border: #dee2e6;
            --white: #ffffff;
            --danger: #dc3545; /* Using danger color for forbidden */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--light-grey);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border-top: 5px solid var(--danger); /* Red top border for forbidden */
        }

        .logo {
            height: 60px;
            margin-bottom: 25px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--danger); /* Red error code */
            line-height: 1;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 1rem;
            color: var(--grey);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--dark-green);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-green);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.2);
        }

        .btn-secondary {
            background: var(--light-grey);
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e2e6ea;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .error-code {
                font-size: 4.5rem;
            }

            .error-title {
                font-size: 1.4rem;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../media/slogo.png" alt="Motorfix Logo" class="logo">
        
        <h1 class="error-code">403</h1>
        <h2 class="error-title">Access Forbidden</h2>
        <p class="error-message">
            Sorry, you do not have permission to access this page.
            If you believe this is an error, please contact support.
        </p>

        <div class="actions">
            <a href="/" class="action-btn btn-primary">
                <i class="fas fa-home"></i> Go to Homepage
            </a>
            <a href="/contact" class="action-btn btn-secondary">
                <i class="fas fa-envelope"></i> Contact Support
            </a>
        </div>
    </div>
</body>
</html>
